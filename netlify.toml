[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "24"

# Netlify installs this automatically; declaring it pins the Next.js runtime
# so App Router routes, image optimisation and headers work on deploy.
[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
